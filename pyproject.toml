[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "face-hunger"
version = "1.0.0"
description = "Private, local-first photo and video face search"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "numpy>=1.26,<3", "opencv-python-headless>=4.10,<5", "Pillow>=11,<13",
  "pillow-heif>=0.21,<2", "scikit-learn>=1.6,<2", "onnxruntime>=1.20,<2",
  "insightface==0.7.3", "python-multipart>=0.0.20,<1"
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.9,<2"]
test = ["pytest>=8.3,<10", "httpx>=0.28,<1"]

[project.scripts]
face-hunger = "backend.__main__:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ai: uses the real buffalo_l models"]
